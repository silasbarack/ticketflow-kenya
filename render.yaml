databases:
  - name: ticketflow-db
    plan: free
    region: oregon
    databaseName: ticketflow_kenya
    user: ticketflow_user

services:
  - type: web
    name: ticketflow-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticketflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Keys the HMAC that protects stored password-reset codes.
      - key: PASSWORD_RESET_SECRET
        generateValue: true
      # Render puts one proxy in front of the service; without this every
      # request looks like it comes from the same IP and per-IP rate limits
      # throttle all users together.
      - key: TRUST_PROXY
        value: "1"
      - key: PLATFORM_COMMISSION_PERCENT
        value: "9"
      - key: ENABLE_MOCK_PAYMENTS
        value: "false"
      - key: MPESA_ENV
        value: sandbox
      # Set these manually in the Render dashboard once you have Daraja sandbox/production credentials.
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      # Ticket and password-reset emails go through Resend's HTTPS API, because
      # Render's free tier blocks outbound SMTP. Create a key at resend.com.
      - key: RESEND_API_KEY
        sync: false
      # e.g. "TicketFlow Kenya <tickets@your-verified-domain>" — the domain must be
      # verified in Resend. "TicketFlow Kenya <onboarding@resend.dev>" works for
      # testing but only delivers to your own Resend account's email address.
      - key: EMAIL_FROM
        sync: false
      # Set to the frontend service's public URL once it's deployed (used for CORS).
      - key: FRONTEND_URL
        sync: false
      # Set to https://<this-service>.onrender.com/api/payments/mpesa/callback once
      # this service is deployed. The /api prefix matters: without it Safaricom's
      # callback 404s and every payment hangs until the sweep expires it.
      - key: MPESA_CALLBACK_URL
        sync: false
      # Settles payments whose callback never arrived — a free-tier service that
      # has spun down misses callbacks outright, so this is what keeps orders
      # from sitting PENDING forever with their stock reserved.
      - key: MPESA_RECONCILIATION_ENABLED
        value: "true"

      # Persona identity verification. Configure these from the Persona Sandbox
      # dashboard first, then replace with Production credentials after testing.
      - key: PERSONA_API_KEY
        sync: false
      - key: PERSONA_TEMPLATE_ID
        sync: false
      - key: PERSONA_ENVIRONMENT_ID
        sync: false
      - key: PERSONA_WEBHOOK_SECRET
        sync: false
      - key: PERSONA_API_VERSION
        value: "2025-10-27"

  - type: web
    name: ticketflow-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # Set to https://<ticketflow-backend>.onrender.com/api once the backend service is deployed.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Buyer-facing service fee shown at checkout. Keep in sync with the backend's PLATFORM_COMMISSION_PERCENT.
      - key: NEXT_PUBLIC_SERVICE_FEE_PERCENT
        value: "9"
